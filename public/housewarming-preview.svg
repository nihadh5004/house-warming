  <text x="600" y="303" text-anchor="middle" fill="#4e2947" font-family="Georgia, serif" font-size="74">Jasna <tspan fill="#b7985b" font-size="46" font-style="italic">&amp;</tspan> Shahina</text>
  <text x="600" y="344" text-anchor="middle" fill="#73526b" font-family="Georgia, serif" font-size="24" font-style="italic">Our dreams and memories have a new address</text>

