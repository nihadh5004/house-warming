<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Housewarming invitation for Jasna and Shahina</title>
  <desc id="description">An elegant ivory invitation framed by an Islamic arch, botanicals and gold details.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Amiri Preview";
        src: url("fonts/Amiri-Regular.ttf") format("truetype");
      }
      .serif { font-family: "Cormorant Garamond", Georgia, serif; }
      .sans { font-family: Manrope, Arial, sans-serif; }
      .arabic { font-family: "Amiri Preview", Amiri, "Noto Naskh Arabic", serif; }
    </style>
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4e2947" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- This relative asset and the bundled font are inlined by scripts/generate-preview.mjs. -->
  <image href="housewarming-preview-artwork.png" xlink:href="housewarming-preview-artwork.png" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>

  <!-- A translucent veil protects small-thumbnail legibility without hiding the paper texture. -->
  <path d="M330 585V238C330 117 439 72 600 46c161 26 270 71 270 192v347Z" fill="#fffdf9" fill-opacity="0.36"/>

  <g text-anchor="middle">
    <rect x="414" y="69" width="372" height="63" rx="31.5" fill="#fffdf9" fill-opacity="0.92" stroke="#d9c38e" stroke-width="1"/>
    <text x="600" y="114" class="arabic" fill="#4e2947" font-size="34" direction="rtl" unicode-bidi="plaintext">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</text>

    <g fill="none" stroke="#b89a5b" stroke-width="1.3">
      <path d="M465 144h91M644 144h91"/>
      <path d="m600 136 8 8-8 8-8-8Z" fill="#b89a5b"/>
    </g>

    <text x="600" y="184" class="sans" fill="#6f7d67" font-size="21" font-weight="600" letter-spacing="2.2">Housewarming Invitation</text>

    <g filter="url(#text-shadow)">
      <text x="600" y="301" class="serif" fill="#4e2947" font-size="84" font-weight="600">
        <tspan>Jasna</tspan><tspan dx="16" fill="#b89a5b" font-size="52" font-style="italic">&amp;</tspan><tspan dx="16">Shahina</tspan>
      </text>
    </g>

    <text x="600" y="364" class="serif" fill="#76546e" font-size="28" font-style="italic">
      <tspan x="600">Our dreams and memories</tspan>
      <tspan x="600" dy="31">have a new address</tspan>
    </text>

    <g transform="translate(600 426)" fill="none" stroke="#b89a5b" stroke-linecap="round">
      <path d="M-76 0h55M21 0h55" stroke-width="1"/>
      <path d="M-7 7V-3c0-11 14-19 14-30C7-22 21-14 21 0V7Z" stroke="#87957e" stroke-width="1.6"/>
      <path d="M-1-8h8v15" stroke-width="1.4"/>
      <circle cx="5" cy="1" r="1.5" fill="#b89a5b" stroke="none"/>
    </g>

    <text x="600" y="491" class="serif" fill="#4e2947" font-size="31" font-weight="600">16 August 2026</text>
    <text x="600" y="529" class="sans" fill="#4e2947" font-size="18" font-weight="600" letter-spacing="1.8">After 5:00 PM</text>
  </g>
</svg>
