      <circle cx="32" cy="32" r="3" fill="#b7985b" fill-opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4e2947" flood-opacity=".13"/>
    </filter>
    <g id="flower">
