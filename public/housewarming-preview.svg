  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#pattern)"/>
  <ellipse cx="600" cy="310" rx="430" ry="300" fill="url(#glow)"/>

  <rect x="31" y="31" width="1138" height="568" rx="4" fill="none" stroke="#b7985b" stroke-width="1.6"/>
