      <ellipse cx="79" cy="112" rx="22" ry="10" fill="#9a7a90" transform="rotate(34 79 112)"/>
      <ellipse cx="96" cy="73" rx="20" ry="9" fill="#9ba88f" transform="rotate(-38 96 73)"/>
      <use href="#flower" transform="translate(114 101)"/>
